<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>AR 遠端專家系統 (專業版)</title>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.18.2.js"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background-color: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { display: flex; gap: 20px; margin-top: 10px; }
        
        /* 統一外框大小，並加上防呆鎖定 */
        .box { 
            border: 2px solid #555; width: 640px; height: 360px; background: #000; 
            position: relative; border-radius: 8px; 
            overflow: hidden; /* 隱藏捲軸 */
            user-select: none; /* 嚴禁反白選取 */
            touch-action: none; /* 禁用手機瀏覽器的手勢滑動 */
        }
        
        #remote-player { width: 100%; height: 100%; }
        #remote-player video { transform: scaleX(-1) !important; object-fit: contain !important; }

        /* 雙層畫布與懸浮物件架構 */
        .canvas-wrapper { position: relative; width: 100%; height: 100%; overflow: hidden; }
        .canvas-wrapper canvas { position: absolute; top: 0; left: 0; }
        #bgCanvas { z-index: 1; }
        #drawCanvas { z-index: 2; cursor: crosshair; }
        
        /* 懸浮文字框設計 */
        #textOverlay {
            position: absolute; z-index: 10; display: none; cursor: move;
            background: rgba(0, 0, 0, 0.6); border: 2px dashed #aaa; padding: 8px; border-radius: 8px;
            align-items: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        #textInput {
            background: transparent; border: none; outline: none; font-weight: bold; font-size: 32px; font-family: 'Microsoft JhengHei';
            text-shadow: 2px 2px 4px #000; width: 200px; color: white;
        }
        #textInput::placeholder { color: rgba(255,255,255,0.4); text-shadow: none; font-size: 20px; }
        #stampBtn {
            background: #28a745; color: white; border: none; border-radius: 5px; padding: 5px 15px; cursor: pointer; font-weight: bold; font-size: 16px;
        }

        /* 工具列設計 */
        .toolbar { background: #333; padding: 10px 20px; border-radius: 10px; display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1300px;}
        button { cursor: pointer; padding: 8px 12px; border-radius: 5px; border: none; font-weight: bold; font-size: 0.95em; transition: 0.2s; background: #555; color: white;}
        button:hover { opacity: 0.8; }
        button.active-tool { background: #ffc107; color: black; box-shadow: 0 0 8px #ffc107; }
        
        .btn-green { background: #28a745; font-size: 1.1em;}
        .btn-blue { background: #007bff; }
        .btn-red { background: #dc3545; }
        .btn-gray { background: #6c757d; font-size: 1.1em;} /* 清除按鈕專用 */
        
        .btn-notify { background: #ffc107; color: black; display: none; animation: pulse 1.5s infinite; font-size: 1.2em; margin-bottom: 10px;}
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <h2>🔧 AR 遠端專家控制台</h2>
    <div id="status" style="color: yellow; margin-bottom: 10px; font-weight: bold;">狀態: 啟動中...</div>

    <button class="btn-notify" id="notifyBtn">🔔 偵測到手機連線！點擊開始監控</button>

    <div class="toolbar" id="mainToolbar" style="display: none;">
        <button class="btn-blue" onclick="takeSnapshot()">📸 1. 擷取畫面</button>
        <div style="width: 2px; height: 30px; background: #777; margin: 0 5px;"></div>
        
        <input type="color" id="colorPicker" value="#ff0000" style="border:none; width:35px; height:35px; cursor:pointer;" title="選擇顏色">
        <input type="range" id="lineWidth" min="2" max="15" value="4" style="width: 80px;" title="粗細">
        
        <button id="tool-pen" class="active-tool" onclick="setTool('pen')">✏️ 畫筆</button>
        <button id="tool-eraser" onclick="setTool('eraser')">🧽 橡皮擦</button>
        <button id="tool-text" onclick="setTool('text')">🔤 文字框</button>
        
        <div style="width: 2px; height: 30px; background: #777; margin: 0 5px;"></div>
        
        <button onclick="undo()">↶ 上一步</button>
        <button onclick="redo()">↷ 下一步</button>
        <button class="btn-red" onclick="clearDrawings()">🗑️ 清空註記</button>

        <div style="width: 2px; height: 30px; background: #777; margin: 0 5px;"></div>
        
        <button class="btn-green" onclick="sendToAR()">🚀 2. 傳回手機</button>
        <button class="btn-gray" onclick="clearARScreen()">📴 3. 清除手機畫面</button>
    </div>

    <div class="container">
        <div class="box">
            <div id="remote-player"></div>
            <div style="position:absolute; top:8px; left:8px; background:rgba(0,0,0,0.7); padding:4px 8px; border-radius:4px; font-size: 12px;">即時監控</div>
        </div>
        <div class="box">
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="bgCanvas" width="640" height="360"></canvas>
                <canvas id="drawCanvas" width="640" height="360"></canvas>
                
                <div id="textOverlay">
                    <input type="text" id="textInput" placeholder="輸入文字..." autocomplete="off">
                    <button id="stampBtn" onclick="stampText()">確認</button>
                </div>
            </div>
            <div style="position:absolute; top:8px; left:8px; background:rgba(0,0,0,0.7); padding:4px 8px; border-radius:4px; font-size: 12px;">截圖編輯區</div>
        </div>
    </div>

    <script>
        // ================= 設定區 =================
        const APP_ID = "";
        const CHANNEL = "1234"; 
        const TOKEN = null; 
        // ==========================================

        const rtc = { client: null };
        const statusDiv = document.getElementById('status');
        const notifyBtn = document.getElementById('notifyBtn');
        const mainToolbar = document.getElementById('mainToolbar');
        let disconnectTimer = null;

        // 🔒 防禦機制：如果瀏覽器試圖滾動畫布容器，強制把它拉回原點！
        document.getElementById('canvasWrapper').addEventListener('scroll', function() {
            this.scrollLeft = 0;
            this.scrollTop = 0;
        });

        window.onload = async function () {
            rtc.client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
            rtc.client.on("user-published", async (user, mediaType) => {
                await rtc.client.subscribe(user, mediaType);
                if (mediaType === "video") {
                    clearTimeout(disconnectTimer);
                    statusDiv.innerText = "手機已上線！等待接收...";
                    statusDiv.style.color = "yellow";
                    notifyBtn.style.display = "block";
                    notifyBtn.onclick = () => {
                        user.videoTrack.play("remote-player");
                        notifyBtn.style.display = "none";
                        mainToolbar.style.display = "flex";
                        statusDiv.innerText = "✅ 視訊連線正常";
                        statusDiv.style.color = "#4cff00";
                    };
                }
            });
            rtc.client.on("user-unpublished", (user, mediaType) => {
                if (mediaType === "video") {
                    statusDiv.innerText = "⚠️ 偵測到手機無畫面，10 秒後重置系統...";
                    statusDiv.style.color = "orange";
                    disconnectTimer = setTimeout(() => {
                        statusDiv.innerText = "自動監聽中，等待手機連線...";
                        statusDiv.style.color = "yellow";
                        notifyBtn.style.display = "none";
                        mainToolbar.style.display = "none";
                        document.getElementById('remote-player').innerHTML = '';
                        clearBg(); clearDrawings();
                    }, 10000);
                }
            });
            try {
                await rtc.client.join(APP_ID, CHANNEL, TOKEN, null);
                statusDiv.innerText = "自動監聽中，等待手機連線...";
            } catch (e) {
                statusDiv.innerText = "Agora 連線失敗"; statusDiv.style.color = "red";
            }
        };

        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const drawCanvas = document.getElementById('drawCanvas');
        const drawCtx = drawCanvas.getContext('2d');

        function takeSnapshot() {
            const videoElement = document.querySelector("#remote-player video");
            if (!videoElement || videoElement.videoWidth === 0) return alert("目前沒有視訊畫面！");
            
            const vw = videoElement.videoWidth, vh = videoElement.videoHeight;
            const cw = bgCanvas.width, ch = bgCanvas.height;
            const scale = Math.min(cw / vw, ch / vh);
            const drawW = vw * scale, drawH = vh * scale;
            const drawX = (cw - drawW) / 2, drawY = (ch - drawH) / 2;
            
            bgCtx.fillStyle = "#111"; bgCtx.fillRect(0, 0, cw, ch);
            bgCtx.save();
            bgCtx.translate(cw, 0); bgCtx.scale(-1, 1);
            bgCtx.drawImage(videoElement, cw - drawX - drawW, drawY, drawW, drawH);
            bgCtx.restore();
            clearDrawings();
        }
        function clearBg() { bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height); }

        let currentTool = 'pen';
        let isDrawing = false, lastX = 0, lastY = 0;
        let historyStack = [], redoStack = [];

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active-tool'));
            document.getElementById('tool-' + tool).classList.add('active-tool');
            if(tool !== 'text') document.getElementById('textOverlay').style.display = 'none';
        }

        function saveState() {
            historyStack.push(drawCanvas.toDataURL());
            if (historyStack.length > 20) historyStack.shift();
            redoStack = [];
        }

        function undo() {
            if (historyStack.length > 0) {
                redoStack.push(drawCanvas.toDataURL());
                restoreState(historyStack.pop());
            } else {
                drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            }
        }
        function redo() {
            if (redoStack.length > 0) {
                historyStack.push(drawCanvas.toDataURL());
                restoreState(redoStack.pop());
            }
        }
        function restoreState(dataUrl) {
            let img = new Image();
            img.onload = function() {
                drawCtx.globalCompositeOperation = 'source-over';
                drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
                drawCtx.drawImage(img, 0, 0);
            }
            img.src = dataUrl;
        }

        function clearDrawings() { 
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height); 
            historyStack = []; redoStack = [];
            document.getElementById('textOverlay').style.display = 'none';
        }

        // === 懸浮文字框邏輯 ===
        const textOverlay = document.getElementById('textOverlay');
        const textInput = document.getElementById('textInput');
        let isDraggingText = false, dragOffsetX = 0, dragOffsetY = 0;

        // 限制拖曳範圍，不讓框框跑出界
        textOverlay.onmousedown = (e) => {
            if (e.target.id === 'textInput' || e.target.id === 'stampBtn') return; 
            isDraggingText = true;
            dragOffsetX = e.clientX - textOverlay.offsetLeft;
            dragOffsetY = e.clientY - textOverlay.offsetTop;
        };
        window.onmousemove = (e) => {
            if (isDraggingText) {
                let newX = e.clientX - dragOffsetX;
                let newY = e.clientY - dragOffsetY;
                
                // 🔓 放寬邊界：允許框框被拖到外面，只要留 30px 在畫布內即可
                newX = Math.max(-50, Math.min(newX, 640 - 30));
                newY = Math.max(-20, Math.min(newY, 360 - 30));
                
                textOverlay.style.left = newX + 'px';
                textOverlay.style.top = newY + 'px';
            }
        };
        window.onmouseup = () => isDraggingText = false;

        function stampText() {
            if(textInput.value.trim() === '') {
                textOverlay.style.display = 'none'; return;
            }
            saveState(); 
            drawCtx.globalCompositeOperation = 'source-over';
            drawCtx.font = "bold 32px Microsoft JhengHei";
            drawCtx.fillStyle = textInput.style.color;
            drawCtx.shadowColor = "black"; drawCtx.shadowBlur = 4; drawCtx.shadowOffsetX = 2; drawCtx.shadowOffsetY = 2;
            
            const x = parseInt(textOverlay.style.left, 10) + 10; 
            const y = parseInt(textOverlay.style.top, 10) + 38; 
            
            drawCtx.fillText(textInput.value, x, y);
            drawCtx.shadowBlur = 0; drawCtx.shadowOffsetX = 0; drawCtx.shadowOffsetY = 0;
            
            textOverlay.style.display = 'none'; 
            textInput.value = ''; 
        }

        textInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') stampText();
        });

        drawCanvas.addEventListener('mousedown', (e) => {
            const rect = drawCanvas.getBoundingClientRect();
            lastX = e.clientX - rect.left; 
            lastY = e.clientY - rect.top;

            if (currentTool === 'text') {
                textOverlay.style.display = 'flex';
                
                // 🔓 放寬出生點：就算點擊最右邊，文字框也會出現
                let spawnX = Math.min(lastX, 640 - 40); 
                let spawnY = Math.max(0, lastY - 40);
                
                textOverlay.style.left = spawnX + 'px'; 
                textOverlay.style.top = spawnY + 'px'; 
                
                textInput.style.color = document.getElementById('colorPicker').value;
                textInput.value = '';
                setTimeout(() => textInput.focus(), 50);
            } else {
                isDrawing = true;
                saveState();
            }
        });

        drawCanvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || currentTool === 'text') return;
            const rect = drawCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left; const y = e.clientY - rect.top;

            drawCtx.beginPath(); drawCtx.moveTo(lastX, lastY); drawCtx.lineTo(x, y);
            drawCtx.lineCap = 'round'; drawCtx.lineJoin = 'round';
            drawCtx.lineWidth = document.getElementById('lineWidth').value;
            
            if (currentTool === 'eraser') {
                drawCtx.globalCompositeOperation = 'destination-out';
                drawCtx.strokeStyle = "rgba(0,0,0,1)";
            } else {
                drawCtx.globalCompositeOperation = 'source-over';
                drawCtx.strokeStyle = document.getElementById('colorPicker').value;
            }
            drawCtx.stroke();
            lastX = x; lastY = y;
        });

        drawCanvas.addEventListener('mouseup', () => isDrawing = false);
        drawCanvas.addEventListener('mouseout', () => isDrawing = false);

        // === 發送圖片給 Unity ===
        function sendToAR() {
            statusDiv.innerText = "正在合併圖片與傳送...";
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 640; tempCanvas.height = 360;
            const tempCtx = tempCanvas.getContext('2d');
            
            tempCtx.drawImage(bgCanvas, 0, 0);
            tempCtx.drawImage(drawCanvas, 0, 0);

            tempCanvas.toBlob((blob) => {
                if(blob) {
                    fetch('http://127.0.0.1:5000/upload', {
                        method: 'POST', body: blob, headers: { 'Content-Type': 'image/jpeg' }
                    }).then(res => {
                        if(res.ok) {
                            statusDiv.innerText = "✅ 圖片已成功發送至手機！";
                            statusDiv.style.color = "#4cff00";
                        }
                    }).catch(err => {
                        statusDiv.innerText = "❌ 發送失敗，請確認 Python bridge 運作中";
                        statusDiv.style.color = "red";
                    });
                }
            }, 'image/jpeg', 0.6);
        }

        // === 新增：發送「全透明圖片」來清除手機畫面 ===
        function clearARScreen() {
            statusDiv.innerText = "正在清除手機端畫面...";
            const emptyCanvas = document.createElement('canvas');
            emptyCanvas.width = 10; emptyCanvas.height = 10; // 只要是很小的一張透明圖就好
            
            // 輸出為 PNG (PNG 支援透明背景，JPEG 不支援)
            emptyCanvas.toBlob((blob) => {
                if(blob) {
                    fetch('http://127.0.0.1:5000/upload', {
                        method: 'POST', body: blob, headers: { 'Content-Type': 'image/png' }
                    }).then(res => {
                        if(res.ok) {
                            statusDiv.innerText = "✅ 手機畫面已清除！(已恢復相機鏡頭)";
                            statusDiv.style.color = "#4cff00";
                        }
                    });
                }
            }, 'image/png');
        }
    </script>
</body>
</html>
