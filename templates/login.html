<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>登入 - 戰情室</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#0e1a2b; --panel:#172537; --accent:#00bfff; --text:#ffffff; --muted:#9bd1ff;
      --line: rgba(0,191,255,.22);
    }
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family:"Segoe UI","Microsoft JhengHei",sans-serif;
      display:grid; place-items:center;
    }
    .card{
      width:min(480px, 92vw);
      background:var(--panel); border:1px solid var(--line); border-radius:14px;
      box-shadow:0 10px 24px rgba(0,0,0,.35), 0 0 0 1px rgba(0,191,255,.06) inset;
      padding:22px; box-sizing:border-box;
    }
    h1{ margin:0 0 14px; font-size:1.4rem; color:var(--muted); text-align:center; }
    label{ display:block; margin:.4rem 0 .35rem; }

    /* 輸入框 */
    .field input{
      width:100%; box-sizing:border-box;
      background:#142132; color:#e8f6ff;
      border:1px solid rgba(0,191,255,.35); border-radius:10px; padding:10px 12px; outline:none;
    }
    .field input:focus{ border-color:var(--accent); }

    /* 密碼：包一層，讓眼睛按鈕定位在框內 */
    .input-wrap{ position:relative; }
    .input-wrap input{ padding-right:44px; } /* 騰出眼睛按鈕空間 */

    .toggle-btn{
      position:absolute; right:8px; top:50%; transform:translateY(-50%);
      width:32px; height:32px; border-radius:8px;
      background:#142132; border:1px solid rgba(0,191,255,.35);
      color:#9bd1ff; display:grid; place-items:center; cursor:pointer;
      line-height:1; padding:0;
    }
    .toggle-btn:hover{ border-color:var(--accent); color:#e8f6ff; }

    .btn{
      width:100%; margin-top:14px; padding:10px 12px;
      background:var(--accent); color:#001722; border:0; border-radius:12px;
      font-weight:800; cursor:pointer;
    }
    .btn:hover{ filter:brightness(1.05) }
    .error{
      background:rgba(255,107,107,.12); border:1px solid rgba(255,107,107,.45);
      color:#ffb3b3; border-radius:10px; padding:8px 10px; margin:10px 0;
    }
    .footer{ margin-top:10px; text-align:center; color:#9bd1ff; font-size:.9rem }
  </style>
</head>
<body>
  <form class="card" method="post" action="{{ url_for('login', next=request.args.get('next')) }}">
    <h1>戰情室登入</h1>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <div class="field">
      <label for="username">帳號</label>
      <input id="username" name="username" autocomplete="username" required>
    </div>

    <div class="field">
      <label for="password">密碼</label>
      <div class="input-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="toggle-btn" id="togglePwd" aria-label="顯示/隱藏密碼" title="顯示/隱藏密碼">
          <!-- 預設：小眼睛（顯示密碼關閉狀態） -->
          <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn" type="submit">登入</button>
    <div class="footer">© Pond Dashboard</div>
  </form>

  <script>
    const pwd = document.getElementById('password');
    const btn = document.getElementById('togglePwd');

    const ICON_EYE = `
      <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>`;
    const ICON_EYE_OFF = `
      <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.8 21.8 0 0 1 5.06-6.94"></path>
        <path d="M22.54 11.88a16.88 16.88 0 0 0-5.06-5.06"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>`;

    btn.addEventListener('click', ()=>{
      const show = pwd.type === 'password';
      pwd.type = show ? 'text' : 'password';
      btn.innerHTML = show ? ICON_EYE_OFF : ICON_EYE;
    });
  </script>

</body>
</html>
